<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmeldung abgeschlossen – Alpine Career</title>
<style>
  :root {
    --ground: #f3f5f8; --surface: #fff; --ink: #16202b; --muted: #5b6a7a;
    --line: #cdd6e0; --accent: #1c6b4a; --warn: #b4232a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground:#0e151d; --surface:#172029; --ink:#e4ebf2;
            --muted:#93a3b3; --line:#2a3744; --accent:#6cc79b; --warn:#e9686e; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 17px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px 60px; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p { margin: 0 0 16px; }
  .lead { color: var(--muted); }
  .code {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 4px solid var(--accent); border-radius: 4px;
    padding: 16px; margin: 20px 0; font-family: ui-monospace, Menlo, monospace;
    font-size: 14px; word-break: break-all; line-height: 1.5;
  }
  button {
    font: inherit; font-weight: 600; color: #fff; background: var(--accent);
    border: 0; border-radius: 6px; padding: 14px 22px; cursor: pointer;
    width: 100%; max-width: 320px;
  }
  button:active { opacity: .85; }
  .hint { font-size: 15px; color: var(--muted); }
  .error { border-left-color: var(--warn); }
  ol { padding-left: 22px; }
  li { margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="ok" hidden>
    <h1>Anmeldung geschafft</h1>
    <p class="lead">Fast fertig — es fehlt nur noch ein Schritt.</p>
    <ol>
      <li>Unten auf <strong>Code kopieren</strong> tippen</li>
      <li>Den Code an David schicken</li>
    </ol>
    <div class="code" id="code"></div>
    <button id="copy" type="button">Code kopieren</button>
    <p class="hint" id="status" style="margin-top:14px"></p>
  </div>

  <div id="fail" hidden>
    <h1>Kein Code erhalten</h1>
    <div class="code error" id="reason"></div>
    <p>Bitte den Anmeldelink aus Telegram nochmals öffnen, am besten in einem
       privaten Fenster, und alle Berechtigungen bestätigen.</p>
  </div>
</div>

<script>
  var params = new URLSearchParams(location.search);
  var code = params.get("code");
  var error = params.get("error");

  if (code) {
    document.getElementById("ok").hidden = false;
    document.getElementById("code").textContent = code;
    document.getElementById("copy").addEventListener("click", function () {
      var status = document.getElementById("status");
      navigator.clipboard.writeText(code).then(function () {
        status.textContent = "Kopiert — jetzt an David schicken.";
      }).catch(function () {
        status.textContent = "Kopieren hat nicht geklappt: Code oben markieren "
                           + "und von Hand kopieren.";
      });
    });
  } else {
    document.getElementById("fail").hidden = false;
    document.getElementById("reason").textContent =
      error ? ("Google meldet: " + error)
            : "In der Adresse steckt kein Code.";
  }
</script>
</body>
</html>
